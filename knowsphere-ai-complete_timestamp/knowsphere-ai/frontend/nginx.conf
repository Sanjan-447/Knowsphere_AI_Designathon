server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets — real bandwidth savings for the JS bundles,
    # meaningful given several of Phase 5's dashboard chunks (recharts
    # especially) are non-trivial in size even after code-splitting.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed build assets aggressively — Vite fingerprints filenames
    # (index-XXXX.js), so a new deploy naturally gets new URLs; there's no
    # staleness risk in caching these for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any route not matching a real static file (e.g.
    # /documents, /analytics — all client-side React Router routes) must
    # still serve index.html, or a hard refresh on any non-root route
    # would 404 at the nginx level before React Router ever gets a chance.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
